name: Temporary main test rewrite

on:
  push:
    branches: [audit/remove-simulated-tests]

permissions:
  contents: write

jobs:
  rewrite-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/remove-simulated-tests
      - name: Replace source-reading test with runtime contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/probe_main.test.ts')
          src = path.read_text()
          src = src.replace("import { readFileSync } from 'node:fs';\n", '')
          src = src.replace("import { resolve } from 'node:path';\n", '')

          marker = "  it('FIX-18-06: beforeunload handler wraps saveData in try/catch"
          start = src.find(marker)
          if start < 0:
              raise SystemExit('source-reading beforeunload test not found')
          end_marker = '\n  });'
          end = src.find(end_marker, start)
          if end < 0:
              raise SystemExit('end of source-reading beforeunload test not found')
          end += len(end_marker)

          new = '\n'.join([
              "  it('FIX-18-06: beforeunload contains save failures instead of leaking them', async () => {",
              "    const error = new Error('save failed');",
              "    mockSaveData.mockImplementation(() => {",
              "      throw error;",
              "    });",
              "    const warnSpy = vi.spyOn(console, 'warn').mockImplementation(() => {});",
              "",
              "    await import('../src/main');",
              "",
              "    expect(() => fireBeforeunload()).not.toThrow();",
              "    expect(mockSaveData).toHaveBeenCalledWith({ immediate: true });",
              "    expect(warnSpy).toHaveBeenCalledWith('[PloppyTV] saveData on beforeunload failed:', error);",
              "  });",
          ])

          path.write_text(src[:start] + new + src[end:])
          PY
      - name: Commit test rewrite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/probe_main.test.ts
          git commit -m "test: exercise beforeunload failure at runtime"
          git push
