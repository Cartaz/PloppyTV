name: Prepare probe A18 fix

on:
  push:
    branches: [audit/ci-vitest-diagnostic]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/probe-a18-html-semantics
          path: repo
      - name: Checkout diagnostic tooling
        uses: actions/checkout@v4
        with:
          ref: audit/ci-vitest-diagnostic
          path: diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: repo/package-lock.json
      - name: Install dependencies
        working-directory: repo
        run: npm ci
      - name: Replace serialization-sensitive HTML probes
        working-directory: repo
        run: |
          python ../diagnostic/.github/scripts/prepare_probe_a18_fix.py tests/probe_a18.test.ts
          npx prettier --write tests/probe_a18.test.ts
      - name: Dependency audit
        working-directory: repo
        run: npm audit --audit-level=high
      - name: Lint
        working-directory: repo
        run: npm run lint
      - name: Format
        working-directory: repo
        run: npm run format:check
      - name: Type-check
        working-directory: repo
        run: npm run typecheck
      - name: Test
        working-directory: repo
        run: npm run test
      - name: Build
        working-directory: repo
        run: npm run build
      - name: Verify change scope
        working-directory: repo
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "tests/probe_a18.test.ts" || { printf 'Unexpected changes:\n%s\n' "$changed"; exit 1; }
      - name: Commit validated fix
        working-directory: repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/probe_a18.test.ts
          git commit -m "test: assert index HTML semantics instead of formatting"
          git push origin HEAD:fix/probe-a18-html-semantics
