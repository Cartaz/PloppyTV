name: Audit Sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh and patch lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Normalize baseline formatting
        run: npm run format
      - name: Apply staged audit patch
        run: |
          cat .github/audit-patch/part-* | base64 -d | gzip -d > /tmp/audit.patch
          echo 'f1a306728348043c946b636a6e0d66b5b013b1be28e9b42fe97824bf2f8c73f7  /tmp/audit.patch' | sha256sum -c -
          patch -p1 --forward --batch < /tmp/audit.patch
          rm -f vitest.config.main.ts
          echo '6cb9ba20716b547bf0a4bb57f87b86128e001e70a4d736ef10d0c28aa9430b24  .github/audit-test-alignment.patch' | sha256sum -c -
          patch -p1 --forward --batch < .github/audit-test-alignment.patch
      - name: Apply canonical formatting
        run: npm run format
      - name: Capture dependency audit
        run: npm audit --json > audit.json || true
      - name: Validate formatted tree
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test
          npm run build
      - name: Upload working tree and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sandbox
          path: |
            audit.json
            src
            tests
            package.json
            package-lock.json
            vitest.config.ts
            vite.config.ts
            index.html
            README.md
            PRIVACY.md
            .github/workflows/ci.yml
            .github/workflows/deploy.yml
          if-no-files-found: error
