name: Prepare TVMaze image trust-boundary fix

on:
  push:
    branches: [audit/tvmaze-image-fix-runner]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/tvmaze-image-trust-boundary
          path: repo
      - name: Checkout patch tooling
        uses: actions/checkout@v4
        with:
          ref: audit/tvmaze-image-fix-runner
          path: diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: repo/package-lock.json
      - name: Install dependencies
        working-directory: repo
        run: npm ci
      - name: Apply trust-boundary change
        working-directory: repo
        run: |
          python ../diagnostic/.github/scripts/prepare_tvmaze_image_fix.py
          npx prettier --write src/lib/utils.ts src/lib/normalize.ts tests/utils.test.ts tests/normalize.test.ts
      - name: Dependency audit
        working-directory: repo
        run: npm audit --audit-level=high
      - name: Lint
        working-directory: repo
        run: npm run lint
      - name: Format
        working-directory: repo
        run: npm run format:check
      - name: Type-check
        working-directory: repo
        run: npm run typecheck
      - name: Test with report
        id: vitest
        working-directory: repo
        shell: bash
        run: |
          set +e
          npm run test -- --reporter=json --outputFile=vitest-report.json >vitest-run.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Summarize test failures
        if: steps.vitest.outputs.exit_code != '0'
        working-directory: repo
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('vitest-report.json', 'utf8'));
          const out = [
            `numTotalTests=${report.numTotalTests ?? 'unknown'}`,
            `numFailedTests=${report.numFailedTests ?? 'unknown'}`,
          ];
          for (const file of report.testResults ?? []) {
            const failed = (file.assertionResults ?? []).filter((test) => test.status === 'failed');
            if (!failed.length) continue;
            out.push(`FILE: ${file.name}`);
            for (const test of failed) {
              out.push(`TEST: ${(test.ancestorTitles ?? []).concat(test.title ?? []).join(' > ')}`);
              for (const message of test.failureMessages ?? []) out.push(message);
            }
          }
          fs.writeFileSync('failure-summary.txt', out.join('\n') + '\n');
          console.log(out.join('\n'));
          NODE
      - name: Upload failure summary
        if: steps.vitest.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: tvmaze-image-test-failures
          path: repo/failure-summary.txt
      - name: Preserve test result
        if: steps.vitest.outputs.exit_code != '0'
        run: exit 1
      - name: Build
        working-directory: repo
        run: npm run build
      - name: Verify change scope
        working-directory: repo
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/lib/normalize.ts src/lib/utils.ts tests/normalize.test.ts tests/utils.test.ts | sort)"
          test "$changed" = "$expected" || { printf 'Unexpected changes:\n%s\n' "$changed"; exit 1; }
      - name: Commit validated fix
        working-directory: repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/utils.ts src/lib/normalize.ts tests/utils.test.ts tests/normalize.test.ts
          git commit -m "fix: restrict persisted poster URLs to TVMaze CDN"
          git push origin HEAD:fix/tvmaze-image-trust-boundary
