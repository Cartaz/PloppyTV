name: Prepare canonical data document fix

on:
  push:
    branches: [audit/canonical-data-runner]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/canonical-data-document
          path: repo
      - name: Checkout patch tooling
        uses: actions/checkout@v4
        with:
          ref: audit/canonical-data-runner
          path: diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: repo/package-lock.json
      - name: Install dependencies
        working-directory: repo
        run: npm ci
      - name: Apply canonical document design
        working-directory: repo
        run: |
          python ../diagnostic/.github/scripts/prepare_canonical_data_document.py
          python ../diagnostic/.github/scripts/finalize_canonical_generated_files.py
          npx prettier --write src/lib/dataDocument.ts src/lib/storage.ts src/components/exportImport.ts README.md tests/probe_dataDocument.test.ts tests/probe_exportimport.test.ts
      - name: Verify single schema owner
        working-directory: repo
        shell: bash
        run: |
          if grep -n -E 'normalizeShow|reconcileAllLists' src/lib/storage.ts src/components/exportImport.ts; then
            echo 'Storage/import still duplicate canonicalization policy'
            exit 1
          fi
          grep -n 'canonicalizeDataDocument' src/lib/storage.ts src/components/exportImport.ts
      - name: Dependency audit
        working-directory: repo
        run: npm audit --audit-level=high
      - name: Lint
        working-directory: repo
        run: npm run lint
      - name: Format
        working-directory: repo
        run: npm run format:check
      - name: Type-check
        working-directory: repo
        run: npm run typecheck
      - name: Test
        working-directory: repo
        run: npm run test
      - name: Build
        working-directory: repo
        run: npm run build
      - name: Verify change scope
        working-directory: repo
        shell: bash
        run: |
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' README.md src/components/exportImport.ts src/lib/dataDocument.ts src/lib/storage.ts tests/probe_dataDocument.test.ts tests/probe_exportimport.test.ts | sort)"
          test "$changed" = "$expected" || { printf 'Unexpected changes:\n%s\n' "$changed"; exit 1; }
      - name: Commit validated fix
        working-directory: repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/components/exportImport.ts src/lib/dataDocument.ts src/lib/storage.ts tests/probe_dataDocument.test.ts tests/probe_exportimport.test.ts
          git commit -m "refactor: centralize persisted data schema handling"
          git push origin HEAD:fix/canonical-data-document
