name: Renderer rationalization audit

on:
  push:
    branches: [audit/renderer-rationalization]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Measure suite without probe_renderer
        run: |
          mv tests/probe_renderer.test.ts /tmp/probe_renderer.test.ts.disabled
          set +e
          npm run test:coverage
          status=$?
          set -e
          echo "coverage_exit=$status"
          exit 0
