name: Format i18n candidate

on:
  push:
    branches: [audit/i18n-format]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: fix/i18n-render-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only showList
        run: npx prettier --write src/views/showList.ts
      - name: Verify scope and push
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "src/views/showList.ts" || { printf 'Unexpected changes:\n%s\n' "$changed"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/showList.ts
          git commit -m "style: format localized show list"
          git push origin HEAD:fix/i18n-render-boundary
